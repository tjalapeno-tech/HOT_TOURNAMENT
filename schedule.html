<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <title>Tournament Schedule</title>

  <link rel="stylesheet" href="style-main.css">
  <link rel="stylesheet" href="style-header.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">

  <style>
    /* Only styling needed for the division selector */
    .division-select-container {
      text-align: center;
      margin-top: 20px;
    }

    select, button {
      padding: 10px 14px;
      font-size: 16px;
      margin: 5px;
    }
  </style>
</head>

<body>
<!-- Header loads here -->
  <div id="header-placeholder"></div>

  <!-- Load the shared header file + attach hamburger -->
  <script>
    fetch("header.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("header-placeholder").innerHTML = data;

        // Attach hamburger behavior AFTER header is inserted
        const hamburger = document.querySelector(".hamburger");
        const nav = document.querySelector(".main-nav");

        if (hamburger && nav) {
          hamburger.addEventListener("click", () => {
            nav.classList.toggle("active");
            console.log("Hamburger clicked");
          });
        }
      });
  </script>

<!-- HERO -->
<section class="hero">
  <h1>Tournament Schedule</h1>
  <p>Select your Division below to view your schedule or visit League Lobster!</p>
  <div class="button-container">
  <a href="https://scheduler.leaguelobster.com/2439637/huntsville-oldtimers/2025/"
     target="_blank"
     class="hot-button">
    Open Alternate Schedule & Standings
  </a>
</div>
</section>

<!-- DIVISION SELECTOR -->
<main class="content-container">
  <div class="division-select-container">
    <label for="divisionSelect" style="font-size: 18px;">Select Your Division:</label><br>

    <select id="divisionSelect">
      <option value="" selected disabled>-- Select Division --</option>
      <option value="Peppler">Peppler (35+)</option>
      <option value="Clarke">Clarke (45+)</option>
      <option value="Conlin">Conlin (45+)</option>
      <option value="McKenzie">McKenzie (55+)</option>
      <option value="Murr">Murr (55+)</option>
      <option value="Calvin">Calvin (Women)</option>
      <option value="Nickerson">Nickerson (Women)</option>
    </select>

    <button id="loadScheduleBtn">Show Schedule</button>
  </div>
</main>

<!-- WIDE SCHEDULE CONTAINER -->
<div class="schedule-container" id="scheduleBox" style="display:none;">
  <iframe id="scheduleFrame"></iframe>
</div>

<!-- SCRIPT -->
<script>
  /* DIVISION → GOOGLE SHEETS LINK MAPPING */
  const scheduleLinks = {
    Peppler: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQCrWyIVn5EczLrC0axjAeVz2u6yBxJr35KnTn7gCwMHp-8qGC_9EwcQPUvb4JhSpw0Xm2Z7geaMES3/pub?gid=353992226&single=true&output=html",
    Clarke:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQCrWyIVn5EczLrC0axjAeVz2u6yBxJr35KnTn7gCwMHp-8qGC_9EwcQPUvb4JhSpw0Xm2Z7geaMES3/pub?gid=536405351&single=true&output=html",
    Conlin:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQCrWyIVn5EczLrC0axjAeVz2u6yBxJr35KnTn7gCwMHp-8qGC_9EwcQPUvb4JhSpw0Xm2Z7geaMES3/pub?gid=1479756402&single=true&output=html",
    McKenzie:"https://docs.google.com/spreadsheets/d/e/2PACX-1vQCrWyIVn5EczLrC0axjAeVz2u6yBxJr35KnTn7gCwMHp-8qGC_9EwcQPUvb4JhSpw0Xm2Z7geaMES3/pub?gid=1934019366&single=true&output=html",
    Murr:    "https://docs.google.com/spreadsheets/d/e/2PACX-1vQCrWyIVn5EczLrC0axjAeVz2u6yBxJr35KnTn7gCwMHp-8qGC_9EwcQPUvb4JhSpw0Xm2Z7geaMES3/pub?gid=2064820182&single=true&output=html",
    Calvin:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQCrWyIVn5EczLrC0axjAeVz2u6yBxJr35KnTn7gCwMHp-8qGC_9EwcQPUvb4JhSpw0Xm2Z7geaMES3/pub?gid=1008848308&single=true&output=html",
    Nickerson:"https://docs.google.com/spreadsheets/d/e/2PACX-1vQCrWyIVn5EczLrC0axjAeVz2u6yBxJr35KnTn7gCwMHp-8qGC_9EwcQPUvb4JhSpw0Xm2Z7geaMES3/pub?gid=1746636518&single=true&output=html"
  };

  /* LOAD BUTTON HANDLER */
  document.getElementById("loadScheduleBtn").addEventListener("click", () => {
    const division = document.getElementById("divisionSelect").value;

    if (!division) {
      alert("Please select a division.");
      return;
    }

    const url = scheduleLinks[division];

    if (!url) {
      alert("Schedule not available for this division yet. View schedule here: https://scheduler.leaguelobster.com/2439637/huntsville-oldtimers/2025/");
      return;
    }

    // Update iframe
    document.getElementById("scheduleFrame").src = url;

    // Show schedule container
    document.getElementById("scheduleBox").style.display = "block";

    // Scroll into view
    document.getElementById("scheduleBox").scrollIntoView({ behavior: "smooth" });
  });
</script>
<div id="ll-schedule-embed" data-schedule-id="2439637" data-language-code="en">
<script type="text/javascript" src="//scheduler.leaguelobster.com/static/embed.js"></script>
</div>
</body>
</html>
