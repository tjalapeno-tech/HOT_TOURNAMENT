<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Schedule</title>

  <link rel="stylesheet" href="style-main.css">
  <link rel="stylesheet" href="style-header.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">

  <style>
    .schedule-box {
      margin-top: 30px;
      display: none; /* Hidden until user selects a division */
      text-align: center;
    }

    iframe {
      width: 100%;
      height: 900px;
      border: none;
    }

    .division-select-container {
      text-align: center;
      margin-top: 20px;
    }

    select, button {
      padding: 10px 14px;
      font-size: 16px;
      margin: 5px;
    }
  </style>
</head>

<body>
<div id="header-placeholder"></div>
<script>
  fetch("header.html")
    .then(res => res.text())
    .then(data => document.getElementById("header-placeholder").innerHTML = data);
</script>

<section class="hero">
  <h1>Tournament Schedule</h1>
  <p>Select your Division below to view your schedule.</p>
</section>

<main class="content-container">

  <div class="division-select-container">
    <label for="divisionSelect" style="font-size: 18px;">Select Your Division:</label><br>
    <select id="divisionSelect">
      <option value="" selected disabled>-- Select Division --</option>
      <option value="Peppler">Peppler (35+)</option>
      <option value="Clarke">Clarke (45+)</option>
      <option value="Conlin">Conlin (45+)</option>
      <option value="Mckenzie">Mckenzie (55+)</option>
      <option value="Murr">Murr (55+)</option>
      <option value="Calvin">Calvin (Women)</option>
      <option value="Nickerson">Nickerson (Women)</option>
      <!-- Add more divisions here -->
    </select>

    <button id="loadScheduleBtn">Show Schedule</button>
  </div>

  <div class="schedule-box" id="scheduleBox">
    <iframe id="scheduleFrame"></iframe>
  </div>

</main>

<script>
  // STEP 1: Map divisions to their Google Sheets embed URLs
  const scheduleLinks = {
    Peppler: "YOUR_GOOGLE_SHEET_EMBED_URL_FOR_TEAM_A",
    Clarke: "YOUR_GOOGLE_SHEET_EMBED_URL_FOR_TEAM_B",
    Conlin: "YOUR_GOOGLE_SHEET_EMBED_URL_FOR_TEAM_C",
    Mckenzie: "YOUR_GOOGLE_SHEET_EMBED_URL_FOR_TEAM_D",
    Murr: "YOUR_GOOGLE_SHEET_EMBED_URL_FOR_TEAM_D",
    Calvin: "YOUR_GOOGLE_SHEET_EMBED_URL_FOR_TEAM_D",
    Nickerson: "YOUR_GOOGLE_SHEET_EMBED_URL_FOR_TEAM_D"
    // Add all divisions here
  };

  document.getElementById("loadScheduleBtn").addEventListener("click", () => {
    const division = document.getElementById("divisionSelect").value;

    if (!division) {
      alert("Please select a division.");
      return;
    }

    const url = scheduleLinks[division];

    if (!url) {
      alert("Schedule not available for this division yet.");
      return;
    }

    // Set iframe source
    document.getElementById("scheduleFrame").src = url;

    // Show schedule box
    document.getElementById("scheduleBox").style.display = "block";

    // Scroll to schedule
    document.getElementById("scheduleBox").scrollIntoView({ behavior: "smooth" });
  });
</script>

</body>
</html>
