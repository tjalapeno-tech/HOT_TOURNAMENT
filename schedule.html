<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Schedule</title>

  <link rel="stylesheet" href="style-main.css">
  <link rel="stylesheet" href="style-header.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">

  <style>
    .schedule-box {
      margin-top: 30px;
      display: none; /* Hidden until user selects a team */
      text-align: center;
    }

    iframe {
      width: 100%;
      height: 900px;
      border: none;
    }

    .team-select-container {
      text-align: center;
      margin-top: 20px;
    }

    select, button {
      padding: 10px 14px;
      font-size: 16px;
      margin: 5px;
    }
  </style>
</head>

<body>
<div id="header-placeholder"></div>
<script>
  fetch("header.html")
    .then(res => res.text())
    .then(data => document.getElementById("header-placeholder").innerHTML = data);
</script>

<section class="hero">
  <h1>Game Schedule</h1>
  <p>Select your team below to view your schedule.</p>
</section>

<main class="content-container">

  <div class="team-select-container">
    <label for="teamSelect" style="font-size: 18px;">Select Your Team:</label><br>
    <select id="teamSelect">
      <option value="" selected disabled>-- Choose Team --</option>
      <option value="teamA">Team A</option>
      <option value="teamB">Team B</option>
      <option value="teamC">Team C</option>
      <option value="teamD">Team D</option>
      <!-- Add more teams here -->
    </select>

    <button id="loadScheduleBtn">Show Schedule</button>
  </div>

  <div class="schedule-box" id="scheduleBox">
    <iframe id="scheduleFrame"></iframe>
  </div>

</main>

<script>
  // STEP 1: Map teams to their Google Sheets embed URLs
  const scheduleLinks = {
    teamA: "YOUR_GOOGLE_SHEET_EMBED_URL_FOR_TEAM_A",
    teamB: "YOUR_GOOGLE_SHEET_EMBED_URL_FOR_TEAM_B",
    teamC: "YOUR_GOOGLE_SHEET_EMBED_URL_FOR_TEAM_C",
    teamD: "YOUR_GOOGLE_SHEET_EMBED_URL_FOR_TEAM_D"
    // Add all teams here
  };

  document.getElementById("loadScheduleBtn").addEventListener("click", () => {
    const team = document.getElementById("teamSelect").value;

    if (!team) {
      alert("Please select a team.");
      return;
    }

    const url = scheduleLinks[team];

    if (!url) {
      alert("Schedule not available for this team yet.");
      return;
    }

    // Set iframe source
    document.getElementById("scheduleFrame").src = url;

    // Show schedule box
    document.getElementById("scheduleBox").style.display = "block";

    // Scroll to schedule
    document.getElementById("scheduleBox").scrollIntoView({ behavior: "smooth" });
  });
</script>

</body>
</html>
