<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact</title>
  <link rel="stylesheet" href="style-main.css">
  <link rel="stylesheet" href="style-header.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
</head>
<body>
<<!-- Header loads here -->
  <div id="header-placeholder"></div>

  <!-- Load the shared header file + attach hamburger -->
  <script>
    fetch("header.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("header-placeholder").innerHTML = data;

        // Attach hamburger behavior AFTER header is inserted
        const hamburger = document.querySelector(".hamburger");
        const nav = document.querySelector(".main-nav");

        if (hamburger && nav) {
          hamburger.addEventListener("click", () => {
            nav.classList.toggle("active");
            console.log("Hamburger clicked");
          });
        }
      });
  </script>

<section class="hero">
  <h1>Contact Us</h1>
  <p>Get in touch with the Huntsville Oldtimers team.</p>
</section>

<main class="form-container">
  <form action="mailto:operations@huntsvilleoldtimers.com" method="POST" enctype="text/plain">
    <div class="form-group">
      <label for="name">Your Name:</label>
      <input type="text" name="Name" id="name" required>
    </div>
    <div class="form-group">
      <label for="email">Your Email:</label>
      <input type="email" name="Email" id="email" required>
    </div>
    <div class="form-group">
      <label for="message">Message:</label>
      <textarea name="Message" id="message" rows="5" cols=60 required></textarea>
    </div>
    <button type="submit">Send Message</button>
  </form>
</main>

</body>
</html>
