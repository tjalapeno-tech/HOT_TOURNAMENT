<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Standings</title>
  <link rel="stylesheet" href="style-main.css">
  <link rel="stylesheet" href="style-header.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">

  <!-- =============================== -->
  <!-- CUSTOM STYLES FOR LEAGUELOBSTER -->
  <!-- =============================== -->
  <style>
    /* Main background override for schedule table */
    #ll-schedule-embed,
    #ll-schedule-embed * {
      background-color: rgba(255,255,255,0.92) !important;
    }

    /* Remove borders that sometimes leak through */
    #ll-schedule-embed table,
    #ll-schedule-embed td,
    #ll-schedule-embed th {
      background-color: rgba(255,255,255,0.92) !important;
      border-color: #1c2e4a !important;
    }

    /* Hide ALL ads injected by LeagueLobster */
    /* These selectors target common ad wrappers used by LL */
    .ll-ad,
    .ll-ads,
    .ll-sponsor,
    .ll-sponsorship,
    [id*="ad"],
    [class*="ad"] {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Remove any padding LL adds around its content */
    #ll-schedule-embed .ll-schedule-wrapper {
      padding: 0 !important;
      margin: 0 !important;
    }
  </style>
  <!-- =============================== -->
</head>

<body>

  <!-- Header loads here -->
  <div id="header-placeholder"></div>

  <!-- Load the shared header file + attach hamburger -->
  <script>
    fetch("header.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("header-placeholder").innerHTML = data;

        // Attach hamburger behavior AFTER header is inserted
        const hamburger = document.querySelector(".hamburger");
        const nav = document.querySelector(".main-nav");

        if (hamburger && nav) {
          hamburger.addEventListener("click", () => {
            nav.classList.toggle("active");
            console.log("Hamburger clicked");
          });
        }
      });
  </script>

<section class="hero">
  <h1>Standings</h1>
  <p>Track team rankings and points throughout the tournament!</p>

  <div id="ll-schedule-embed" data-schedule-id="2439637" data-language-code="en"></div>
  <script type="text/javascript" src="//scheduler.leaguelobster.com/static/embed.js"></script>
</section>

<main class="content-container">
  <p>Standings will be updated here as games are played.</p>
</main>

</body>
</html>
