<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register Your Team</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
  <style>
    .form-group {
      margin-bottom: 20px;
    }

    select option:disabled {
      color: gray;
    }
  </style>
</head>
<body>
<div id="header-placeholder"></div>
<script>
  fetch("header.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("header-placeholder").innerHTML = data;
    });
</script>

<main class="form-container">
  <h1>Team Registration</h1>
  <form id="registrationForm">
    <div class="form-group">
      <label>Team Name*</label>
      <input type="text" id="team" required>
    </div>

    <div class="form-group">
      <label>Team Rep*</label>
      <input type="text" id="repName" required>
    </div>

    <div class="form-group">
      <label>Contact Email*</label>
      <input type="email" id="repEmail" required>
    </div>

    <div class="form-group">
      <label>Contact Phone*</label>
      <input type="text" id="repPhone" required>
    </div>

    <div class="form-group">
      <label>Division*</label>
      <select id="division" required></select>
    </div>

    <div class="form-group">
      <label>Skill Level*</label>
      <select id="skill" required>
        <option value="">--Select--</option>
        <option>A</option>
        <option>B</option>
        <option>C</option>
        <option>D</option>
        <option>E</option>
      </select>
    </div>

    <button type="submit" id="submitBtn">Register</button>
  </form>
</main>

<script>
const scriptUrl = "https://script.google.com/macros/s/AKfycbx7p7VywAv1C0CWPtwlznQ-yTN6DcLUZ5P4ye5Ep7t7MRZcOO83uPHYjjo4LWFN30sEYw/exec";

let formSubmitted = false;

async function populateDivisions() {
  const res = await fetch(scriptUrl);
  const data = await res.json();
  const select = document.getElementById('division');
  select.innerHTML = '<option value="">--Select--</option>';

  for (const division in data) {
    const { count, limit } = data[division];
    const remaining = limit - count;
    const option = document.createElement("option");
    option.value = division;
    option.innerText = `${division} (${remaining} spot${remaining !== 1 ? 's' : ''} left)`;
    if (remaining <= 0) option.disabled = true;
    select.appendChild(option);
  }
}

document.addEventListener("DOMContentLoaded", populateDivisions);

document.getElementById('registrationForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');

  if (formSubmitted) return;
  formSubmitted = true;
  btn.disabled = true;
  btn.textContent = "Submitting...";

  const data = {
    team: document.getElementById('team').value.trim(),
    repName: document.getElementById('repName').value.trim(),
    repEmail: document.getElementById('repEmail').value.trim(),
    repPhone: document.getElementById('repPhone').value.trim(),
    division: document.getElementById('division').value,
    skill: document.getElementById('skill').value
  };

  fetch(scriptUrl, {
    method: 'POST',
    body: JSON.stringify(data)
  })
  .then(response => {
    if (response.ok) {
      alert("Team successfully registered!");
      window.location.href = "payment.html";
    } else {
      throw new Error("Submission failed.");
    }
  })
  .catch(err => {
    alert("Error: " + err.message);
    formSubmitted = false;
    btn.disabled = false;
    btn.textContent = "Register";
  });
});
</script>
</body>
</html>
