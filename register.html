<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register Your Team</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
</head>
<body>

<div id="header-placeholder"></div>
<script>
  fetch("header.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("header-placeholder").innerHTML = data;
    });
</script>

<main class="form-container">
  <h1>Team Registration</h1>
  <form id="registrationForm">
    <div class="form-group">
      <label>Team Name*</label>
      <input type="text" id="team" required>
    </div>

    <div class="form-group">
      <label>Team Rep*</label>
      <input type="text" id="repName" required>
    </div>

    <div class="form-group">
      <label>Contact Email*</label>
      <input type="email" id="repEmail" required>
    </div>

    <div class="form-group">
      <label>Contact Phone*</label>
      <input type="text" id="repPhone" required>
    </div>

    <div class="form-group">
      <label>Division*</label>
      <select id="division" required></select>
    </div>

    <div class="form-group">
      <label>Skill Level*</label>
      <select id="skill" required>
        <option value="">--Select--</option>
        <option>A</option>
        <option>B</option>
        <option>C</option>
        <option>D</option>
        <option>E</option>
      </select>
    </div>

    <button type="submit">Register</button>
  </form>
</main>

<script>
const divisionSelect = document.getElementById("division");
const form = document.getElementById("registrationForm");
let formSubmitted = false;

window.addEventListener("DOMContentLoaded", () => {
  fetch("https://script.google.com/macros/s/PASTE_YOUR_DEPLOYED_URL_HERE/exec")
    .then(res => res.json())
    .then(data => {
      const divisions = {
        "Men 35+": "Men 35+",
        "Men 45+": "Men 45+",
        "Men 55+": "Men 55+",
        "Women Open": "Women Open"
      };

      Object.entries(divisions).forEach(([key, label]) => {
        const spots = data[key];
        const option = document.createElement("option");
        option.value = key;
        option.disabled = spots <= 0;
        option.textContent = `${label} (${spots > 0 ? spots + ' spot' + (spots > 1 ? 's' : '') + ' left' : 'Full'})`;
        divisionSelect.appendChild(option);
      });
    })
    .catch(err => {
      console.error("Error fetching divisions:", err);
    });
});

form.addEventListener("submit", function(e) {
  e.preventDefault();
  if (formSubmitted) return;

  const registerButton = this.querySelector('button[type="submit"]');
  formSubmitted = true;
  registerButton.disabled = true;
  registerButton.textContent = "Registering...";

  const data = {
    team: document.getElementById('team').value.trim(),
    repName: document.getElementById('repName').value.trim(),
    repEmail: document.getElementById('repEmail').value.trim(),
    repPhone: document.getElementById('repPhone').value.trim(),
    division: document.getElementById('division').value,
    skill: document.getElementById('skill').value
  };

  fetch("https://script.google.com/macros/s/AKfycbw5NBuP31v6U1O1V-dGodsi7wZ3Td5lbFR8n9NThTsZ8MH8LUYYZduWtKu5jgYejxj4Uw/exec", {
    method: 'POST',
    body: JSON.stringify(data)
  })
  .then(response => {
    if (response.ok) {
      alert("Team successfully registered!");
      window.location.href = "payment.html";
    } else {
      throw new Error("Form submission failed.");
    }
  })
  .catch(error => {
    alert("Error: " + error.message);
    formSubmitted = false;
    registerButton.disabled = false;
    registerButton.textContent = "Register";
  });
});
</script>

</body>
</html>
