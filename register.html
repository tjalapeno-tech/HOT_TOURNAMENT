<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register Your Team</title>
  <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Load shared header -->
<div id="header-placeholder"></div>
<script>
  fetch("header.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("header-placeholder").innerHTML = data;
    });
</script>
<main class="form-container">
  <h1>Team Registration</h1>
  <form id="registrationForm">
  <div class="form-group">
    <label>Team Name*</label>
    <input type="text" id="team" required>
  </div>

  <div class="form-group">
    <label>Team Rep*</label>
    <input type="text" id="repName" required>
  </div>

  <div class="form-group">
    <label>Contact Email*</label>
    <input type="text" id="repEmail" required>
  </div>

  <div class="form-group">
    <label>Contact Phone*</label>
    <input type="text" id="repPhone" required>
  </div>

  <div class="form-group">
    <label>Division*</label>
    <select id="division" required>
      <option value="">--Select--</option>
      <option>Men 35+</option>
      <option>Men 45+</option>
      <option>Men 55+</option>
      <option>Women Open</option>
    </select>
  </div>

  <div class="form-group">
    <label>Skill Level*</label>
    <select id="skill" required>
      <option value="">--Select--</option>
      <option>A</option>
      <option>B</option>
      <option>C</option>
      <option>D</option>
      <option>E</option>
    </select>
  </div>

  <button type="submit">Register</button>
</form>
<script>
let formSubmitted = false;

document.getElementById('registrationForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const registerButton = this.querySelector('button[type="submit"]');

  if (formSubmitted) {
    return; // Prevent multiple submits
  }

  formSubmitted = true;
  registerButton.disabled = true;
  registerButton.textContent = "Registering...";

  const data = {
    team: document.getElementById('team').value.trim(),
    repName: document.getElementById('repName').value.trim(),
    repEmail: document.getElementById('repEmail').value.trim(),
    repPhone: document.getElementById('repPhone').value.trim(),
    division: document.getElementById('division').value
    skill: document.getElementByID('skill').value
  };

  fetch("https://script.google.com/macros/s/AKfycbyKWAzFFLPDXYCc4L2OyRGb5yYQ-3RRmFX7ERCzzICyTdakOuYSg1LrXjczezrJpkI4Yw/exec", {
    method: 'POST',
    body: JSON.stringify(data)
  })
  .then(response => {
    if (response.ok) {
      alert("Team successfully registered!");
      window.location.href = "payment.html";
    } else {
      throw new Error("Failed to submit form.");
    }
  })
  .catch(error => {
    alert('Error: ' + error.message);
    formSubmitted = false;
    registerButton.disabled = false;
    registerButton.textContent = "Register";
  });
});
</script>
</main>
<script>
    function handleFormSubmit() {
      // Wait briefly and redirect to payment screen
      setTimeout(() => {
        window.location.href = "/payment.html"; // You can change this to your payment page
      }, 200);

      return true; // Allow the form to submit via mailto
    }
  </script>
</body>
</html>
