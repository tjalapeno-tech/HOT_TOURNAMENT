<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register Your Team</title>
  <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Load shared header -->
<div id="header-placeholder"></div>
<script>
  fetch("header.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("header-placeholder").innerHTML = data;
    });
</script>
<main class="form-container">
  <h1>Team Registration</h1>
  <form id="registrationForm">
  <div class="form-group">
    <label>Team Name*</label>
    <input type="text" id="team" required>
  </div>

  <div class="form-group">
    <label>Team Rep*</label>
    <input type="text" id="rep" required>
  </div>

  <div class="form-group">
    <label>Contact Info*</label>
    <input type="text" id="contact" required>
  </div>

  <div class="form-group">
    <label>Division*</label>
    <select id="division" required>
      <option value="">--Select--</option>
      <option>Men 35+</option>
      <option>Men 45+</option>
      <option>Men 55+</option>
      <option>Women Open</option>
    </select>
  </div>

  <div class="form-group">
    <label>Skill Level*</label>
    <select id="skill" required>
      <option value="">--Select--</option>
      <option>A</option>
      <option>B</option>
      <option>C</option>
      <option>D</option>
      <option>E</option>
    </select>
  </div>

  <button type="submit">Register</button>
</form>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbx2dSi3-50CHjio9qByKfW080iZ-Yz8vXKtiVC5dvC0-p2TEZoRMAwY3Cv8InlSf4duRg/exec';

  document.getElementById('registrationForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const data = {
      team: document.getElementById('team').value,
      rep: document.getElementById('rep').value,
      contact: document.getElementById('contact').value,
      division: document.getElementById('division').value,
      skill: document.getElementById('skill').value
    };

    fetch(scriptURL, {
      method: 'POST',
      body: JSON.stringify(data)
    })
    .then(response => {
      alert("Team successfully registered!");
      window.location.href = "payment.html";
    })
    .catch(error => alert('Error: ' + error.message));
  });
</script>

</main>
<script>
    function handleFormSubmit() {
      // Wait briefly and redirect to payment screen
      setTimeout(() => {
        window.location.href = "/payment.html"; // You can change this to your payment page
      }, 200);

      return true; // Allow the form to submit via mailto
    }
  </script>
</body>
</html>
